name: Checks

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-latest
    env:
      UV_FROZEN: "true"
      UV_MANAGED_PYTHON: "true" # Use the standalone runtime verified by macOS packaging.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.18"
          python-version: "3.12"
          enable-cache: true
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=low
      - run: uv export --project apps/python-backend/backend --frozen --no-dev --no-emit-project --no-hashes --output-file /tmp/backend-requirements.txt
      - run: uvx pip-audit --requirement /tmp/backend-requirements.txt --no-deps --disable-pip
      - run: npm run make:mac
