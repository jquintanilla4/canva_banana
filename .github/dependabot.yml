version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /apps/python-backend/backend
    schedule:
      interval: weekly
    groups:
      maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
