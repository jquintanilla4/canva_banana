version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        versions: [">=6.1.0"] # ESLint tooling currently supports TypeScript below 6.1.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"] # Match the Node 24 runtime before upgrading types.
    groups:
      maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /apps/python-backend/backend
    schedule:
      interval: weekly
    groups:
      maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
