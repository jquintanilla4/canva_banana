[project]
name = "canva-banana-volcengine-service"
version = "0.1.0"
description = "Local Volcengine Seedance 2 service for Canva Banana"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.20",
  "tos",
  "uvicorn[standard]>=0.35.0",
  "volcengine-python-sdk[ark]>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volcengine_service"]
